@media(max-width:599px){

  .card .lbl{margin-bottom:0px;}

  .hideMob{display:none;}

  .mbuy button{flex:1;padding:clamp(4px,1.8vw,8px) clamp(6px,3vw,14px);font-size:clamp(12px,3.6vw,16px);font-weight:700;}

}
.pgtitle{font-size:16px;font-weight:700;margin-bottom:10px;color:#1a1a1a;}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
(function(){
'use strict';

const WORKER='https://candle-practice-1min.kim80091.workers.dev';
const FEE=.0023, VP=8, VIS=60; // 키움증권 실수수료: 매수 0.015% + 매도 0.215% = 왕복 0.230%
const TAIL_VISIBLE=20;  // 전일 마지막 몇 분을 실제 캔들로 화면에 보여줄지
const SEED_LEN=60;      // 전일 마지막 몇 분을 가져올지 (표시 20 + 계산 전용 40)
const FULL_DAY=720;     // 08:01~20:00 = 720분 (이보다 적으면 누락)
const BAND=0.13;        // 가격차트 하단에 신호 막대 3개를 그리는 영역 비율

let days=[];            // [{date,count,first,last}] 오래된 순
let curDate=null;
let shuffleBag=[];
let candles=[], timer=null, pos=null, tPnl=0, trades=[];
let intSec=1, elapsed=0, capital=100000000;
let wins=0, losses=0, holdSum=0;
let tradeHistory=[], aiCount=0, lastTradeRecord=null;
let histCandles=[];     // 전일 시드 중 화면에 안 보이는 부분(계산 전용)

// 통이 비면 전체 날짜를 다시 채우고 섞음(Fisher-Yates), 하나 뽑아서 반환 → 모든 날짜가 한 번씩 나온 뒤 반복
function drawFromBag(){
  if(!shuffleBag.length){
    shuffleBag=days.map((_,i)=>i);
    for(let i=shuffleBag.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [shuffleBag[i],shuffleBag[j]]=[shuffleBag[j],shuffleBag[i]];
    }
  }
  return shuffleBag.pop();
}

// ── 지표 ─────────────────────────────────────────────────────
// idx>=0: candles 배열, idx<0: 전일 시드(histCandles)에서 역산해서 가져옴
function closeAt(idx){
  if(idx>=0)return candles[idx]?candles[idx].close:undefined;
  const hIdx=histCandles.length+idx;
  return hIdx>=0?histCandles[hIdx].close:undefined;
}
// 단순이동평균 (idx 시점 기준). MA(C,p,단순,k) = ma(p, idx-k)
function ma(p,idx){
  let s=0;
  for(let i=idx-p+1;i<=idx;i++){
    const c=closeAt(i);
    if(c===undefined)return null;
    s+=c;
  }
  return s/p;
}
// 볼린저밴드 (기간 20, 표준편차 배수 2)
const BB_PERIOD=20, BB_MULT=2;
function bbStats(idx){
  let sum=0;
  for(let i=idx-BB_PERIOD+1;i<=idx;i++){
    const c=closeAt(i);
    if(c===undefined)return null;
    sum+=c;
  }
  const mid=sum/BB_PERIOD;
  let sq=0;
  for(let i=idx-BB_PERIOD+1;i<=idx;i++){
    const c=closeAt(i);
    sq+=(c-mid)*(c-mid);
  }
  return {mid,sd:Math.sqrt(sq/BB_PERIOD)};
}
function bbUpper(idx){const b=bbStats(idx);return b?b.mid+BB_MULT*b.sd:null;}
function bbLower(idx){const b=bbStats(idx);return b?b.mid-BB_MULT*b.sd:null;}

// MA5 저점반전: M1<M2 and M0>M1 and C>M0   (M0=MA5, M1=1봉전 MA5, M2=2봉전 MA5)
function sigMA5Rev(idx){
  const m0=ma(5,idx),m1=ma(5,idx-1),m2=ma(5,idx-2),c=closeAt(idx);
  if(m0===null||m1===null||m2===null||c===undefined)return 0;
  return(m1<m2&&m0>m1&&c>m0)?1:0;
}
// MA30 추세반전: T0<T1 and C>T0 and C>M10   (T0=MA30, T1=1봉전 MA30, M10=MA10)
function sigMA30Rev(idx){
  const t0=ma(30,idx),t1=ma(30,idx-1),m10=ma(10,idx),c=closeAt(idx);
  if(t0===null||t1===null||m10===null||c===undefined)return 0;
  return(t0<t1&&c>t0&&c>m10)?1:0;
}
// MA30 추세(+만): MA30 > 1봉전 MA30
function sigMA30Up(idx){
  const t0=ma(30,idx),t1=ma(30,idx-1);
  if(t0===null||t1===null)return 0;
  return t0>t1?1:0;
}
// 겹침매수신호: SIG2 and (SIG1 or SIG3)
//   SIG2 = MA5 저점반전, SIG1 = MA30 추세반전, SIG3 = MA30 상승 and C>=MA30
function sigOverlapBuy(idx){
  if(!sigMA5Rev(idx))return 0;
  if(sigMA30Rev(idx))return 1;
  const t0=ma(30,idx),t1=ma(30,idx-1),c=closeAt(idx);
  if(t0===null||t1===null||c===undefined)return 0;
  return(t0>t1&&c>=t0)?1:0;
}
// 박스 구간: S=(MA20-5봉전 MA20)/5봉전 MA20*100, ANGLE=ATAN(S)*180/π, -10<ANGLE<10 이면 1
function boxZone(idx){
  const t0=ma(20,idx),t1=ma(20,idx-5);
  if(t0===null||t1===null||t1===0)return 0;
  const s=(t0-t1)/t1*100;
  const angle=Math.atan(s)*180/3.141592;
  return(angle<10&&angle>-10)?1:0;
}

// ── 스냅샷 (AI 분석용) ──────────────────────────────────────
function snapshot(idx){
  if(idx<0||idx>=candles.length)return null;
  const c=candles[idx];
  const m5=ma(5,idx),m30=ma(30,idx);

  let upStreak=0,downStreak=0;
  for(let i=idx-1;i>=Math.max(0,idx-5);i--){
    if(candles[i].close>=candles[i].open)upStreak++;else break;
  }
  for(let i=idx-1;i>=Math.max(0,idx-5);i--){
    if(candles[i].close<candles[i].open)downStreak++;else break;
  }

  const body=Math.abs(c.close-c.open);
  const upperWick=c.high-Math.max(c.close,c.open);
  const lowerWick=Math.min(c.close,c.open)-c.low;
  const range=c.high-c.low||1;
  let candleShape='보통';
  if(body/range>0.7)candleShape=c.close>=c.open?'장대양봉':'장대음봉';
  else if(upperWick/range>0.5)candleShape='윗꼬리 긴 봉';
  else if(lowerWick/range>0.5)candleShape='아랫꼬리 긴 봉(망치형)';
  else if(body/range<0.2)candleShape='도지(십자봉)';

  const gapMa5=m5?((c.close-m5)/m5*100).toFixed(2):null;
  const gapMa30=m30?((c.close-m30)/m30*100).toFixed(2):null;

  let prev20High=-Infinity;
  for(let i=Math.max(0,idx-20);i<idx;i++)if(candles[i].high>prev20High)prev20High=candles[i].high;
  const breakout=prev20High>0&&c.close>prev20High;

  let avgVol=0,volCount=0;
  for(let i=Math.max(0,idx-20);i<idx;i++){avgVol+=candles[i].volume;volCount++;}
  avgVol=volCount>0?avgVol/volCount:c.volume;
  const volRatio=avgVol>0?(c.volume/avgVol*100).toFixed(0):'0';

  return{
    price:c.close,ma5:m5,ma30:m30,gapMa5,gapMa30,
    overlapBuy:sigOverlapBuy(idx)===1,box:boxZone(idx)===1,
    ma5Rev:sigMA5Rev(idx)===1,ma30Rev:sigMA30Rev(idx)===1,
    volRatio,isUp:c.close>=c.open,candleShape,upStreak,downStreak,breakout
  };
}
function maStatus(s){
  if(!s||!s.ma5||!s.ma30)return'데이터 부족';
  return s.ma5>s.ma30?'MA5>MA30 (단기 우위)':'MA5<MA30 (단기 열위)';
}

// ── 차트 플러그인 ─────────────────────────────────────────────
const uC='#E24B4A',dC='#378ADD';
const bC='#0F6E56',sC='#993556';
const pC='#D93025',lC='#2F6FD3'; // 손익 표시 전용: 수익=빨강, 손실=파랑
const C_OVBUY='#FF4FA3';   // 겹침매수신호 (핑크)
const C_BOX='#378ADD';     // 박스 구간 (파랑)
const C_MA5REV='#FFD400';  // MA5 저점반전 (노랑)
const C_MA30REV='#39FF14'; // MA30 추세반전 (형광초록)
const C_MA30UP='#E53935';  // MA30 추세(+만) (빨강)

Chart.register({id:'ann',afterDraw(chart){
  const o=chart.options.plugins&&chart.options.plugins.ann;
  if(!o||!o.list)return;
  const{ctx,scales,chartArea}=chart;
  const x=scales.x,y=scales.y;
  ctx.save();
  for(const a of o.list){
    if(a.t==='box'){
      ctx.fillStyle=a.bg;
      const x1=x.getPixelForValue(a.x1),x2=x.getPixelForValue(a.x2);
      const y1=y.getPixelForValue(a.y2),y2=y.getPixelForValue(a.y1);
      ctx.fillRect(x1,y1,Math.max(1,x2-x1),Math.max(1,y2-y1));
    }else if(a.t==='wick'){
      ctx.strokeStyle=a.cl;ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(x.getPixelForValue(a.xi),y.getPixelForValue(a.hi));
      ctx.lineTo(x.getPixelForValue(a.xi),y.getPixelForValue(a.lo));
      ctx.stroke();
    }else if(a.t==='sigbar'){
      // 가격차트 하단 영역에 그리는 신호 막대 (값 1.5 / 0.9 / 0.3 이 높이에 비례)
      const px=x.getPixelForValue(a.xi);
      const halfW=Math.max(1,(x.getPixelForValue(a.xi+0.35)-x.getPixelForValue(a.xi-0.35))/2);
      const bandPx=(chartArea.bottom-chartArea.top)*BAND;
      const h=a.v*(bandPx/1.6);
      ctx.fillStyle=a.cl;
      ctx.fillRect(px-halfW,chartArea.bottom-h,halfW*2,h);
    }else if(a.t==='circ'){
      // MA30 추세반전 신호: 캔들 위 형광초록 동그라미
      const cx=x.getPixelForValue(a.xi),cy=y.getPixelForValue(a.yi)-11;
      ctx.beginPath();ctx.arc(cx,cy,4.5,0,Math.PI*2);
      ctx.fillStyle=C_MA30REV;ctx.fill();
      ctx.lineWidth=1;ctx.strokeStyle='#1E9E00';ctx.stroke();
    }else if(a.t==='vline'){
      ctx.strokeStyle=a.cl||'rgba(120,120,120,.55)';ctx.lineWidth=a.w||1;ctx.setLineDash(a.dash||[4,3]);
      const px=x.getPixelForValue(a.xi);
      ctx.beginPath();
      ctx.moveTo(px,chartArea.top);ctx.lineTo(px,chartArea.bottom);
      ctx.stroke();
      ctx.setLineDash([]);
    }else if(a.t==='label'){
      // 데이터 좌표가 아니라 차트 영역 좌상단에 고정되는 작은 배지
      ctx.font='11px -apple-system,BlinkMacSystemFont,sans-serif';
      const padX=6,boxH=17;
      const textW=ctx.measureText(a.text).width;
      const bx=chartArea.left+4,by=chartArea.top+4;
      ctx.fillStyle=a.bg||'rgba(217,119,6,0.9)';
      ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(bx,by,textW+padX*2,boxH,3);else ctx.rect(bx,by,textW+padX*2,boxH);
      ctx.fill();
      ctx.fillStyle=a.color||'#fff';
      ctx.textBaseline='middle';
      ctx.fillText(a.text,bx+padX,by+boxH/2+1);
    }else if(a.t==='arrow'){
      const px=x.getPixelForValue(a.xi),py=y.getPixelForValue(a.yi),sz=(a.half?8*.65:8)/3;
      const gap=16; // 캔들과 화살표 사이 최소 여백(고정 픽셀)
      ctx.lineJoin='round';
      if(a.up){
        const tipY=py+gap,by=tipY+sz*1.8;
        ctx.beginPath();ctx.moveTo(px,tipY);ctx.lineTo(px-sz,by);ctx.lineTo(px+sz,by);ctx.closePath();
        ctx.fillStyle='#fff';ctx.fill();
        ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
        ctx.fillStyle=a.cl;ctx.fill();
        ctx.lineWidth=1.5;ctx.strokeStyle=a.cl;ctx.stroke();
        ctx.beginPath();ctx.moveTo(px,by);ctx.lineTo(px,by+sz);ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
        ctx.lineWidth=1.5;ctx.strokeStyle=a.cl;ctx.stroke();
      }else{
        const tipY=py-gap,by=tipY-sz*1.8;
        ctx.beginPath();ctx.moveTo(px,tipY);ctx.lineTo(px-sz,by);ctx.lineTo(px+sz,by);ctx.closePath();
        ctx.fillStyle='#fff';ctx.fill();
        ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
        ctx.fillStyle=a.cl;ctx.fill();
        ctx.lineWidth=1.5;ctx.strokeStyle=a.cl;ctx.stroke();
        ctx.beginPath();ctx.moveTo(px,by);ctx.lineTo(px,by-sz);ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
        ctx.lineWidth=1.5;ctx.strokeStyle=a.cl;ctx.stroke();
      }
    }
  }
  ctx.restore();
}});

    {label:'BB하단',data:[],borderColor:'#B388FF',borderWidth:1.2,pointRadius:0,tension:.1,spanGaps:true,borderDash:[4,3],fill:2,backgroundColor:'rgba(179,136,255,0.10)'},

    scales:{
      x:{

          font:{size:9},color:'#888',

            const pad=padOffset(),s=vs();

          const s=vs(),pad=padOffset();
          const firstXi=pad;
          const lastXi=pad+(candles.length-1-s);
          const maxTicks=6;
          let positions=[];
          if(lastXi<=firstXi){
            positions=[lastXi];
          }else{
            const step=(lastXi-firstXi)/(maxTicks-1);
            for(let i=0;i<maxTicks-1;i++)positions.push(Math.round(firstXi+i*step));
            // 마지막(최신) 눈금과 너무 가까워 겹칠 앞쪽 눈금은 빼고, 최신 시각은 항상 표시
            const minGap=Math.max(4,step*0.6);
            while(positions.length&&lastXi-positions[positions.length-1]<minGap)positions.pop();
            positions.push(lastXi);
          }
          positions=[...new Set(positions)].filter(v=>v>=0);
          axis.ticks=positions.map(v=>({value:v}));
        }
      },
      y:{position:'right',ticks:{font:{size:11},padding:6,callback:v=>Math.round(v).toLocaleString('ko-KR')},afterFit:s=>{s.width=64;},grid:{color:'rgba(128,128,128,.1)'}}

// ── 뷰 계산 ──────────────────────────────────────────────────
function vs(){return Math.max(0,candles.length-VIS);}
function padOffset(){return Math.max(0,VIS-(candles.length-vs()));}
function mkLbl(){return Array.from({length:VIS+VP},(_,i)=>i);}
function vdata(fn){
  const s=vs(),a=[];
  for(let i=s;i<candles.length;i++)a.push(fn(i));
  while(a.length<VIS)a.unshift(null);
  for(let i=0;i<VP;i++)a.push(null);
  return a;
}
function buildPA(){
  const list=[],s=vs(),pad=padOffset();
  for(let i=s;i<candles.length;i++){
    const c=candles[i],li=pad+(i-s),up=c.close>=c.open;
    list.push({t:'box',x1:li-.35,x2:li+.35,y1:Math.min(c.open,c.close),y2:Math.max(c.open,c.close),bg:up?uC:dC});
    list.push({t:'wick',xi:li,hi:c.high,lo:c.low,cl:up?uC:dC});
    // 차트 하단 신호 막대 3개 (키 큰 것부터 그려서 작은 것이 앞에 보이도록)
    if(sigMA5Rev(i))list.push({t:'sigbar',xi:li,v:1.5,cl:C_MA5REV});
    const rev30=sigMA30Rev(i);
    if(rev30)list.push({t:'sigbar',xi:li,v:0.9,cl:C_MA30REV});
    if(sigMA30Up(i))list.push({t:'sigbar',xi:li,v:0.3,cl:C_MA30UP});
    // MA30 추세반전 신호가 나온 캔들 위에 형광초록 동그라미
    if(rev30)list.push({t:'circ',xi:li,yi:c.high});
  }
  trades.forEach(t=>{
    if(t.i<s||t.i>=candles.length)return;
    const c=candles[t.i],li=pad+(t.i-s);
    list.push({t:'arrow',xi:li,yi:t.buy?c.low:c.high,cl:t.buy?bC:sC,up:t.buy,half:t.half});
  });
  // 날짜 분기선 (전일 ↔ 당일 첫 봉 경계)
  const ts=window._todayStartIdx;
  if(ts>0&&ts>=s&&ts<candles.length){
    list.push({t:'vline',xi:pad+(ts-s)-.5});
  }
  // 데이터누락: 당일 또는 전일 데이터가 20:00 마감까지 온전하지 않으면 좌상단에 작게 표시
  if(window._dataIncomplete){
    list.push({t:'label',text:'데이터누락'});
  }
  return list;
}

// ── 차트 갱신 ────────────────────────────────────────────────
function refresh(){
  if(!candles.length)return;
  const s=vs(),lbls=mkLbl();
  PC.data.labels=lbls;
  PC.data.datasets[0].data=vdata(i=>ma(5,i));
  PC.data.datasets[1].data=vdata(i=>ma(30,i));
  PC.data.datasets[2].data=vdata(i=>bbUpper(i));
  PC.data.datasets[3].data=vdata(i=>bbLower(i));
  PC.options.plugins.ann.list=buildPA();

  let mn=Infinity,mx=-Infinity;
  for(let i=s;i<candles.length;i++){
    if(candles[i].low<mn)mn=candles[i].low;
    if(candles[i].high>mx)mx=candles[i].high;
    const bu=bbUpper(i),bl=bbLower(i);
    if(bu!==null&&bu>mx)mx=bu;
    if(bl!==null&&bl<mn)mn=bl;
  }
  const pd=(mx-mn)*.08;
  let lo=mn-pd;const hi=mx+pd;
  // 하단 BAND 비율만큼은 가격이 닿지 않도록 비워서, 거기에 신호 막대 3개를 그림
  lo=lo-(hi-lo)*BAND/(1-BAND);
  PC.options.scales.y.min=lo;PC.options.scales.y.max=hi;

  // 겹침매수신호 패널 (핑크)
  OVB.data.labels=lbls;
  const ovData=vdata(i=>sigOverlapBuy(i));
  OVB.data.datasets[0].data=ovData;
  OVB.data.datasets[0].backgroundColor=ovData.map(v=>v===1?C_OVBUY:'rgba(0,0,0,0)');
  const ovEl=document.getElementById('vOvBuy');
  if(sigOverlapBuy(candles.length-1)===1){ovEl.textContent='신호';ovEl.style.color=C_OVBUY;}
  else{ovEl.textContent='-';ovEl.style.color='#555';}

  // 박스 구간 패널 (파랑)
  BXC.data.labels=lbls;
  const bxData=vdata(i=>boxZone(i));
  BXC.data.datasets[0].data=bxData;
  BXC.data.datasets[0].backgroundColor=bxData.map(v=>v===1?C_BOX:'rgba(0,0,0,0)');
  const bxEl=document.getElementById('vBox');
  if(boxZone(candles.length-1)===1){bxEl.textContent='박스';bxEl.style.color=C_BOX;}
  else{bxEl.textContent='-';bxEl.style.color='#555';}

  PC.update('none');OVB.update('none');BXC.update('none');
  updateUI();
}

// ── UI 갱신 ──────────────────────────────────────────────────
function fp(v){return Math.round(v).toLocaleString('ko-KR');}
function updateUI(){
  if(!candles.length)return;
  const last=candles[candles.length-1];
  const lastChg=last.open>0?(last.close-last.open)/last.open*100:0;
  const lcEl=document.getElementById('vLastChg');
  lcEl.textContent=(lastChg>0?'+':'')+lastChg.toFixed(2)+'%';
  lcEl.style.color=lastChg>0?pC:lastChg<0?lC:'#1a1a1a';
  if(pos){
    const net=(last.close-pos.p)/pos.p*100-FEE*100;
    const el=document.getElementById('vPnl');
    el.textContent=net.toFixed(2)+'%';el.style.color=net>=0?pC:lC;
    const pctTxt=pos.frac<0.999?' ('+Math.round(pos.frac*100)+'% 보유)':'';
    document.getElementById('vHold').textContent=(elapsed-pos.d)+'분째'+pctTxt;
  }else{
    const el=document.getElementById('vPnl');el.textContent='-';el.style.color='#1a1a1a';
    document.getElementById('vHold').textContent='-';
  }
  let asset=capital*(1+tPnl/100);
  if(pos){const net=(last.close-pos.p)/pos.p*100-FEE*100;asset=capital*(1+(tPnl+net*pos.frac)/100);}
  const ael=document.getElementById('vAsset');
  ael.textContent=fp(Math.round(asset))+'원';ael.style.color=asset>=capital?pC:lC;
  const pnlAmt=Math.round(asset-capital);
  const pel=document.getElementById('vPnlAmt');
  pel.textContent=(pnlAmt>=0?'+':'')+fp(pnlAmt)+'원';pel.style.color=pnlAmt>=0?pC:lC;
  const anel=document.getElementById('vAnnual');
  if(tPnl!==0||wins+losses>0){
    anel.textContent=tPnl.toFixed(2)+'%';
    anel.style.color=tPnl>0?pC:(tPnl<0?lC:'#1a1a1a');
  }else{anel.textContent='-';anel.style.color='#1a1a1a';}
  const tot=wins+losses;
  const winRecs=tradeHistory.filter(t=>t.win);
  const lossRecs=tradeHistory.filter(t=>!t.win);
  let plRatioTxt='-';
  if(winRecs.length>0&&lossRecs.length>0){
    const avgWin=winRecs.reduce((a,t)=>a+t.netPct,0)/winRecs.length;
    const avgLoss=lossRecs.reduce((a,t)=>a+Math.abs(t.netPct),0)/lossRecs.length;
    if(avgLoss>0)plRatioTxt=(avgWin/avgLoss).toFixed(2);
  }
  document.getElementById('vTradeCount').textContent=tot+'회 | '+plRatioTxt;
  const wrel=document.getElementById('vWin');
  if(tot>0){const wr=wins/tot*100;wrel.textContent=wr.toFixed(1)+'% ('+tot+'회)';wrel.style.color=wr>=50?pC:lC;}
  else{wrel.textContent='0% (0회)';wrel.style.color='#1a1a1a';}
  document.getElementById('vAvgHold').textContent=tot>0?(holdSum/tot).toFixed(1)+'분':'-';
  document.getElementById('dayLabel').textContent='경과: '+elapsed+'분째';
}

// ── 매매 ─────────────────────────────────────────────────────
function log(t){
  const el=document.getElementById('tlog'),d=document.createElement('div');
  d.textContent=t;el.prepend(d);
}
function doBuy(buyFrac){
  // buyFrac: 1 => 잔여 전부 매수, 0.5 => 1/2분할매수 (1번째 클릭 50%, 2번째 클릭에 잔여 전부)
  if(!candles.length)return;
  const last=candles[candles.length-1],idx=candles.length-1;
  if(pos&&pos.frac>=0.999){log('이미 전량 매수 상태입니다.');return;}
  if(pos&&buyFrac>=1){log('분할 매수 진행 중입니다. 1/2분할매수를 이용하세요.');return;}

  const addFrac=pos?(1-pos.frac):(buyFrac>=1?1:0.5);
  if(addFrac<=0)return;

  if(!pos){
    pos={p:last.close,frac:addFrac,i:idx,d:elapsed,snap:snapshot(idx),maxPct:0,minPct:0,sellContribSum:0,sellAmtSum:0,halfSellUsed:false};
  }else{
    pos.p=(pos.p*pos.frac+last.close*addFrac)/(pos.frac+addFrac);
    pos.frac+=addFrac;
  }
  trades.push({i:idx,buy:true,half:buyFrac<1});
  const pct=Math.round(pos.frac*100);
  log((buyFrac<1?'1/2분할매수':'매수')+' @ '+fp(last.close)+' ('+elapsed+'분째) — 보유비중 '+pct+'%');
  refresh();
}
function doSell(sellFrac){
  // sellFrac: 1 => 보유 전량 매도(청산), 0.5 => 1/2분할매도 (1번째 클릭 보유량의 50%, 2번째 클릭에 잔여 전부)
  if(!pos){log('보유 중인 포지션이 없습니다.');return;}
  const last=candles[candles.length-1],idx=candles.length-1;
  const gross=(last.close-pos.p)/pos.p*100;
  const net=gross-FEE*100;

  let sellAmt;
  if(sellFrac>=1){
    sellAmt=pos.frac;
  }else if(!pos.halfSellUsed){
    sellAmt=pos.frac*0.5;
    pos.halfSellUsed=true;
  }else{
    sellAmt=pos.frac;
  }

  tPnl+=net*sellAmt;
  pos.sellContribSum+=net*sellAmt;
  pos.sellAmtSum+=sellAmt;
  pos.frac-=sellAmt;

  trades.push({i:idx,buy:false,half:sellFrac<1});
  const remainPct=Math.round(pos.frac*100);
  const closing=pos.frac<=0.001;
  const holdTxt=closing?' | 보유 '+(elapsed-pos.d)+'분':'';
  log((sellFrac<1?'1/2분할매도':'매도')+' @ '+fp(last.close)+holdTxt+' | '+net.toFixed(2)+'% (비중 '+Math.round(sellAmt*100)+'%'+(closing?'':', 잔여 '+remainPct+'%')+')');

  if(closing){
    // 포지션 완전 청산 → 거래 1건으로 기록 (여러 번의 분할매도는 비중 가중평균으로 집계)
    const avgNet=pos.sellAmtSum>0?pos.sellContribSum/pos.sellAmtSum:net;
    const h=elapsed-pos.d;holdSum+=h;
    avgNet>0?wins++:losses++;
    const record={
      no:tradeHistory.length+1,
      buyPrice:pos.p,sellPrice:last.close,
      buyDay:pos.d,sellDay:elapsed,holdDays:h,
      netPct:avgNet,grossPct:avgNet+FEE*100,
      maxPct:pos.maxPct,minPct:pos.minPct,
      win:avgNet>0,
      buySnap:pos.snap,sellSnap:snapshot(idx)
    };
    tradeHistory.push(record);
    lastTradeRecord=record;
    pos=null;refresh();
    document.getElementById('aiStatus').textContent='분석 대기 중 — 버튼을 눌러 요청하세요';
  }else{
    refresh();
  }
}

// ── tick ─────────────────────────────────────────────────────
function tick(){
  if(!window._realAllCandles||window._realNextIdx>=window._realAllCandles.length){
    stopT();
    log('데이터 종료 — 20:00 장 마감까지 재생 완료');
    return;
  }
  candles.push(window._realAllCandles[window._realNextIdx]);
  window._realNextIdx++;
  elapsed++;
  if(pos){
    const cur=(candles[candles.length-1].close-pos.p)/pos.p*100;
    if(cur>pos.maxPct)pos.maxPct=cur;
    if(cur<pos.minPct)pos.minPct=cur;
  }
  refresh();
}
function startT(){if(timer)return;timer=setInterval(tick,intSec*1000);updateToggleLabel();}
function stopT(){if(timer){clearInterval(timer);timer=null;}updateToggleLabel();}
function updateToggleLabel(){
  const label=timer?'⏸':'▶';
  const t1=document.getElementById('btnToggleT'),t2=document.getElementById('btnToggleTM');
  if(t1)t1.textContent=label;
  if(t2)t2.textContent=label;
}
function toggleStart(){if(timer)stopT();else startT();}

// ── Worker API ───────────────────────────────────────────────
async function fetchJSON(url){
  const r=await fetch(url,{cache:'no-store'});
  return await r.json();
}
function normalize(arr){
  return (arr||[]).map(d=>({time:d.time,open:d.open,high:d.high,low:d.low,close:d.close,volume:d.volume||0}))
    .sort((a,b)=>a.time<b.time?-1:a.time>b.time?1:0);
}
async function loadDays(){
  try{
    showOv('날짜 목록 불러오는 중...');
    const js=await fetchJSON(WORKER+'/hynix/days');
    hideOv();
    days=(js.days||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
    if(!days.length){
      alert('저장된 SK하이닉스 데이터가 없습니다.\nhynix_sync.py를 먼저 실행하세요.');
      return;
    }
    const sel=document.getElementById('daySel');
    sel.innerHTML='';
    for(let i=days.length-1;i>=0;i--){ // 최신 날짜가 위로
      const d=days[i];
      const o=document.createElement('option');
      o.value=d.date;
      o.textContent=d.date+' ('+d.count+'분)'+(d.count<FULL_DAY?' ⚠누락':'');
      sel.appendChild(o);
    }
    shuffleBag=[];
    const date=days[drawFromBag()].date;
    sel.value=date;
    loadDay(date);
  }catch(e){
    hideOv();
    alert('날짜 목록 로드 실패: '+e.message);
  }
}
async function loadDay(date){
  showOv(date+' 불러오는 중...');
  stopT();
  try{
    const di=days.findIndex(d=>d.date===date);
    const prevDate=di>0?days[di-1].date:null;
    const [js,pjs]=await Promise.all([
      fetchJSON(WORKER+'/hynix/day?date='+date),
      prevDate?fetchJSON(WORKER+'/hynix/day?date='+prevDate).catch(()=>null):Promise.resolve(null)
    ]);
    if(js.error)throw new Error(js.error);
    const todayCandles=normalize(js.candles);
    if(todayCandles.length<10)throw new Error('데이터 부족');

    // 전일 마지막 SEED_LEN분: 최근 TAIL_VISIBLE분은 실제 캔들로 보여주고, 나머지는 지표 계산에만 사용
    let visiblePrefix=[];
    histCandles=[];
    let prevIncomplete=true; // 전일 데이터가 없거나 20:00 마감까지 안 채워졌으면 누락 처리
    if(pjs&&!pjs.error&&pjs.candles&&pjs.candles.length){
      const tail=normalize(pjs.candles).slice(-SEED_LEN);
      const vis=Math.min(TAIL_VISIBLE,tail.length);
      visiblePrefix=tail.slice(tail.length-vis);
      histCandles=tail.slice(0,tail.length-vis);
      prevIncomplete=pjs.candles.length<FULL_DAY;
    }

    const allCandles=visiblePrefix.concat(todayCandles);
    const todayStartIdx=visiblePrefix.length;
    const startIdx=todayStartIdx+1; // 당일 첫 봉까지만 먼저 표시, 이후는 ▶로 1분씩 재생
    candles=allCandles.slice(0,startIdx);
    window._realAllCandles=allCandles;
    window._realNextIdx=startIdx;
    window._todayStartIdx=todayStartIdx;

    const todayIncomplete=todayCandles.length<FULL_DAY;
    window._dataIncomplete=todayIncomplete||prevIncomplete;

    curDate=date;
    elapsed=0;
    resetStats();refresh();

    const firstT=todayCandles[0].time.slice(11,16);
    const lastT=todayCandles[todayCandles.length-1].time.slice(11,16);
    let note='';
    if(todayIncomplete)note+=' (당일 부분누락)';
    if(prevIncomplete)note+=' (전일 '+(prevDate?'부분누락':'데이터 없음')+')';
    setBanner('📈 SK하이닉스 | '+date.replace(/-/g,'')+' | '+firstT+'~'+lastT+note,'breal');
    hideOv();
  }catch(e){
    hideOv();alert('불러오기 실패: '+e.message);
  }
}

// ── AI 분석 ──────────────────────────────────────────────────
async function callAI(prompt){
  const res=await fetch(WORKER+'/ai',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({prompt})
  });
  const data=await res.json();
  if(data.error)throw new Error(data.error);
  return data.text;
}

보유기간: ${record.holdDays}분  |  결과: ${record.win?'수익':'손실'}
보유 중 최고 수익률: +${record.maxPct.toFixed(2)}%  |  보유 중 최저 수익률: ${record.minPct.toFixed(2)}%

===== 매수 시점 =====

MA5 이격: ${bs&&bs.gapMa5?bs.gapMa5:'N/A'}%  |  MA30 이격: ${bs&&bs.gapMa30?bs.gapMa30:'N/A'}%
겹침매수신호: ${yn(bs&&bs.overlapBuy)}  |  박스 구간: ${bs&&bs.box?'예':'아니오'}
MA5 저점반전: ${yn(bs&&bs.ma5Rev)}  |  MA30 추세반전: ${yn(bs&&bs.ma30Rev)}
봉 모양: ${bs&&bs.candleShape?bs.candleShape:'N/A'}  |  ${bs&&bs.isUp?'양봉':'음봉'}

직전 20봉 평균 거래량 대비: ${bs&&bs.volRatio?bs.volRatio:'N/A'}%

async function requestPatternAnalysis(){
  if(tradeHistory.length<3)return;
  document.getElementById('aiPatternBox').style.display='block';
  document.getElementById('aiPatternText').textContent='⏳ 패턴 분석 중...';

  const tot=wins+losses;
  const wr=(wins/tot*100).toFixed(1);
  const avgH=(holdSum/tot).toFixed(1);
  const winTrades=tradeHistory.filter(t=>t.win);
  const lossTrades=tradeHistory.filter(t=>!t.win);
  const avgWin=winTrades.reduce((s,t)=>s+t.netPct,0)/(wins||1);
  const avgLoss=lossTrades.reduce((s,t)=>s+t.netPct,0)/(losses||1);
  const maxWin=Math.max(...tradeHistory.map(t=>t.netPct));
  const maxLoss=Math.min(...tradeHistory.map(t=>t.netPct));
  const pf=losses>0?Math.abs(avgWin/avgLoss):99;
  const buyOverlap=tradeHistory.filter(t=>t.buySnap&&t.buySnap.overlapBuy).length;
  const buyBox=tradeHistory.filter(t=>t.buySnap&&t.buySnap.box).length;
  const avgMaxPct=tradeHistory.reduce((s,t)=>s+t.maxPct,0)/tot;
  const earlyExits=tradeHistory.filter(t=>t.maxPct-t.netPct>3).length;
  const avgHW=winTrades.length>0?winTrades.reduce((s,t)=>s+t.holdDays,0)/winTrades.length:0;
  const avgHL=lossTrades.length>0?lossTrades.reduce((s,t)=>s+t.holdDays,0)/lossTrades.length:0;

  const prompt=`당신은 주식 단기 매매 트레이닝 코치입니다. 학습자의 SK하이닉스 1분봉 ${tot}회 매매 전체 패턴을 분석해주세요. 마크다운 없이 일반 텍스트로, 한국어로 답변하세요.

===== 전체 성과 =====
승률: ${wr}% (${wins}승 ${losses}패)
평균 수익: +${avgWin.toFixed(2)}%  |  평균 손실: ${avgLoss.toFixed(2)}%
최대 수익: +${maxWin.toFixed(2)}%  |  최대 손실: ${maxLoss.toFixed(2)}%
손익비: ${pf.toFixed(2)}
평균 보유기간: ${avgH}분 (수익: ${avgHW.toFixed(1)}분 / 손실: ${avgHL.toFixed(1)}분)
누적 손익: ${tPnl.toFixed(2)}%

===== 매수 습관 =====
겹침매수신호가 떠 있을 때 매수: ${buyOverlap}/${tot}회
박스 구간에서 매수: ${buyBox}/${tot}회

===== 매도 습관 =====
평균 최고 수익률: +${avgMaxPct.toFixed(2)}%
최고점 대비 3% 이상 손실 후 매도: ${earlyExits}/${tot}회

===== 최근 5거래 =====
${tradeHistory.slice(-5).map(t=>'#'+t.no+': '+(t.win?'수익':'손실')+' '+t.netPct.toFixed(1)+'% | 보유'+t.holdDays+'분 | 최고+'+t.maxPct.toFixed(1)+'%').join('\n')}

아래 5가지를 번호와 제목 붙여서 서술하세요.
1. 매수 습관 분석
2. 매도 습관 분석
3. 손익비 분석
4. 반복되는 실수 패턴
5. 지금 당장 실천해야 할 개선책 (2~3가지)`;

  try{
    const text=await callAI(prompt);
    document.getElementById('aiPatternText').textContent=text;
  }catch(e){
    document.getElementById('aiPatternText').textContent='패턴 분석 오류: '+e.message;
  }
}
